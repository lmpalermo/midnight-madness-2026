name: Deploy Midnight Mayhem to Firebase Hosting
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test party games
        run: node --test trivia.test.js charades.test.js roulette.test.js
      - name: Prepare public website files
        run: |
          mkdir -p public
          cp index.html tv.html game.html style.css site.js trivia.js game.js charades.html charades-rules.js charades.js roulette.html roulette-rules.js roulette.js public/
      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          channelId: live
          projectId: midnight-madness-2026
